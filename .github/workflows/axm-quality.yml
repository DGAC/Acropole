name: axm-quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axm-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  AXM_VERSION: "0.10.0"
  AXM_AUDIT_VERSION: "0.13.0"
  AXM_INIT_VERSION: "0.18.0"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: AXM Audit + Init + Badges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --all-groups --locked
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate badge helpers
        run: bash .github/scripts/test_badge_helpers.sh

      - name: Fetch optional badge logo
        run: |
          curl -fsSL https://raw.githubusercontent.com/axm-protocols/axm-forge/main/assets/logo.svg \
            > /tmp/axm-logo.svg || rm -f /tmp/axm-logo.svg

      - name: Run tests with coverage
        id: coverage
        run: |
          source .github/scripts/badge-helpers.sh
          mkdir -p _publish/badges _publish/reports

          uv run --locked pytest --cov --cov-report=json:_publish/reports/coverage.json --no-cov-on-fail -q

          COV=$(jq -er '.totals.percent_covered_display' _publish/reports/coverage.json)
          write_badge "_publish/badges" "coverage" "coverage" "$COV"
          echo "coverage=$COV" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COV}%"

      - name: Run AXM Audit
        id: audit
        run: |
          source .github/scripts/badge-helpers.sh
          STATUS=0
          RESULT=$(uvx --from "axm==$AXM_VERSION" --with "axm-audit==$AXM_AUDIT_VERSION" \
            --with "axm-init==$AXM_INIT_VERSION" axm audit --path . --json-output) || STATUS=$?
          # Exit 1 may mean quality findings; only a valid scored report is accepted.
          if [ "$STATUS" -gt 1 ]; then exit "$STATUS"; fi
          printf '%s\n' "$RESULT" > _publish/reports/axm-audit.json
          require_valid_result "$RESULT" "_publish/badges" "axm-audit" "axm-audit"
          SCORE=$(jq -r '.score' _publish/reports/axm-audit.json)
          write_badge "_publish/badges" "axm-audit" "axm-audit" "$SCORE" /tmp/axm-logo.svg
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "AXM Audit: $SCORE/100"

      - name: Run AXM Init Check
        id: check
        run: |
          source .github/scripts/badge-helpers.sh
          STATUS=0
          RESULT=$(uvx --from "axm==$AXM_VERSION" --with "axm-audit==$AXM_AUDIT_VERSION" \
            --with "axm-init==$AXM_INIT_VERSION" axm init_check --path . --json-output) || STATUS=$?
          if [ "$STATUS" -gt 1 ]; then exit "$STATUS"; fi
          printf '%s\n' "$RESULT" > _publish/reports/axm-init.json
          require_valid_result "$RESULT" "_publish/badges" "axm-init" "axm-init"
          SCORE=$(jq -r '.score' _publish/reports/axm-init.json)
          write_badge "_publish/badges" "axm-init" "axm-init" "$SCORE" /tmp/axm-logo.svg
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "AXM Init: $SCORE/100"

      - name: Upload badges and source reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-badges
          path: _publish/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check snapshot is still current
        if: github.ref == 'refs/heads/main'
        id: current
        run: |
          LATEST=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LATEST" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded snapshot $GITHUB_SHA (main is $LATEST)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push badges and reports to gh-pages
        if: steps.current.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_publish
          keep_files: true
          commit_message: "ci: audit=${{ steps.audit.outputs.score }} init=${{ steps.check.outputs.score }} cov=${{ steps.coverage.outputs.coverage }}%"
