[project]
name = "acropole"
version = "1.0.0"
description = "Open-source library to predict aircraft fuel flow from trajectory data using machine learning models"
readme = "README.md"
license = { text = "GNU Affero General Public License v3.0" }
authors = [
    { name = "Gabriel JARRY", email = "gabriel.jarry@aviation-civile.gouv.fr" },
]
requires-python = ">=3.9"
dependencies = [
    "scipy>=1.13",
    "joblib>=1.4",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "onnxruntime>=1.17",
]

[project.urls]
Homepage = "https://github.com/DGAC/Acropole/"
Repository = "https://github.com/DGAC/Acropole/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acropole"]

[tool.hatch.build.targets.sdist]
include = [
    "/acropole",
    "/tests",
    "/LICENSE",
    "/README.md",
]
