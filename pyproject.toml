[project]
name = "acropole"
description = "Open-source library to predict aircraft fuel flow from trajectory data using machine learning models"
readme = "README.md"
license = { text = "GNU Affero General Public License v3.0" }
authors = [
    { name = "Gabriel JARRY", email = "jarry.gabriel@gmail.com" },
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    # narwhals is the dataframe abstraction: the library never imports polars or
    # pandas directly, so users bring whichever backend they already have.
    "narwhals>=2.0",
    # onnxruntime < 1.19.2 was built against numpy 1.x and fails to import
    # under numpy 2 (_ARRAY_API not found); 1.19.2 is the first numpy-2 build.
    "onnxruntime>=1.19.2",
    "cyclopts>=3.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Frame backends. None is required: narwhals dispatches to whichever the caller
# passes in, so install the one you already work with.
polars = ["polars>=1.0"]
pandas = ["pandas>=2.2"]
pyarrow = ["pyarrow>=15"]
# The CLI reads files itself, so it does need a concrete backend.
cli = ["polars>=1.0"]

[project.scripts]
acropole = "acropole.cli:main"

[project.urls]
Homepage = "https://github.com/DGAC/Acropole/"
Documentation = "https://DGAC.github.io/Acropole/"
Repository = "https://github.com/DGAC/Acropole/"
Issues = "https://github.com/DGAC/Acropole/issues"
Changelog = "https://github.com/DGAC/Acropole/releases"

[dependency-groups]
dev = [
    # every backend, so the test suite can exercise all narwhals paths
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=24.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pip-audit>=2.0",
    "pandas-stubs>=3.0.3.260530",
    "bandit>=1.9.4",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/acropole/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/acropole"]

[tool.hatch.build.targets.wheel.force-include]
"docs/index.md" = "acropole/docs/index.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/LICENSE",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=acropole",
    "--cov-report=term-missing",
]
filterwarnings = ["error"]
markers = [
    "integration: tests that load the packaged model and example data",
    "e2e: end-to-end / CLI tests",
]

[tool.coverage.run]
branch = true
source = ["acropole"]
relative_files = true
# cli.py is exercised black-box via subprocess (tests/e2e), which coverage.py
# cannot instrument; it is verified by the e2e suite, not line coverage.
omit = ["*/_version.py", "*/cli.py"]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "C4", "C901", "PLR", "S", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]  # asserts + non-snake test method names
"tests/e2e/**" = ["S101", "N802", "S603"]  # + subprocess calls are intentional
"src/acropole/cli.py" = ["T201"]  # the CLI prints to stdout/stderr by design

[tool.ruff.lint.isort]
known-first-party = ["acropole"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# Physical fuel model: estimate()/_derivatives legitimately take many per-sample
# feature arrays (groundspeed, altitude, mass, second, d_*). 11 covers them.
max-args = 11

[tool.axm-audit.mirror]
# cli.py is a thin I/O façade over FuelEstimator; it is exercised black-box by
# the e2e suite (tests/e2e/test_acropole_cli.py), not by a unit mirror.
exempt_paths = ["cli.py"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
warn_unused_configs = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

[tool.deptry]
# src/ imports no frame library directly — only narwhals — so the polars/pandas
# extras need no per-rule ignores here.
known_first_party = ["acropole"]
extend_exclude = ["examples", "tests"]

[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^doc", group = "📚 Documentation" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🔧 Refactor" },
    { message = "^test", group = "🧪 Tests" },
]
tag_pattern = "v[0-9].*"
