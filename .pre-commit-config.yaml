repos:
  # Use the locked project tools for the same versions locally and in CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --locked mypy --config-file pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
        args: [src, tests]

  # Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
